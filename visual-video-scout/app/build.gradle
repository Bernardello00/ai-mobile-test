plugins { id 'com.android.application' }

android {
    namespace 'com.andrea.visualvideoscout'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.andrea.visualvideoscout'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    androidResources {
        noCompress += ['onnx']
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
}
