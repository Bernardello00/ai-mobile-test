name: Build Visual Video Scout APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'visual-video-scout/**'
      - '.github/workflows/visual-video-scout-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle -p visual-video-scout :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s visual-video-scout/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging visual-video-scout/app/build/outputs/apk/debug/app-debug.apk | head -20

      - name: Rename APK
        run: cp visual-video-scout/app/build/outputs/apk/debug/app-debug.apk VisualVideoScout-0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VisualVideoScout-APK
          path: VisualVideoScout-0.1.0.apk
          if-no-files-found: error
          retention-days: 7
